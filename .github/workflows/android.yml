name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sovereign-world-command-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sovereign-world-command-apk
          path: sovereign-world-command-debug.apk
          if-no-files-found: error
      - name: Publish APK as the "apk-latest" pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest sovereign-world-command-debug.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Latest APK build" \
            --notes "Debug APK built from $GITHUB_SHA ($GITHUB_REF_NAME). Download the .apk on your Android phone and open it to install."
